context:
  version: 0.6.0
  sha256: 0eeb2575b3eca698939364b0cbb38505cc7fa773ac07fb33985089e92c97c5cc

package:
  name: ruffle
  version: ${{ version }}

source:
  url: https://github.com/ruffle-rs/ruffle/releases/download/v${{ version }}/ruffle-${{ version }}-reproducible-source.zip
  sha256: ${{ sha256 }}
  patches:
  - changes.patch

build:
  number: 0
  script:
    content:
    - set "LIBCLANG_PATH=%BUILD_PREFIX%\Library\bin\libclang.dll"
    - cargo fetch
    - cargo install -F jpegxr --frozen --no-track --path desktop --profile dist --root "%LIBRARY_PREFIX%"
    env:
      CARGO_HOME: ${{ env.get('CARGO_HOME', default='') }}
  skip:
  - not win
  - build_platform != target_platform
  - not (compiler('c') is startingwith('vs'))

requirements:
  build:
  - ${{ compiler('c') }}
  - libclang >=23.1.0
  - openjdk
  - rust >=1.89.0
  - if: microarch_level|int > 0
    then: x86_64-microarch-level ==${{ microarch_level }}
  run:
  - openh264 ==2.4.1

tests:
- script:
  - set "USERPROFILE=%HOMEDRIVE%%HOMEPATH%"
  - ruffle -V

about:
  license_file: LICENSE.md
  summary: A Flash Player emulator written in Rust
