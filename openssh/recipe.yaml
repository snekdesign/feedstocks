context:
  version: 10.4.0
  sha256: c669281dfa3ebca740b91499bcf62de22ceedb111ae7d149a4007224f211a51a

package:
  name: openssh
  version: ${{ version }}p1

source:
- url: https://codeload.github.com/PowerShell/openssh-portable/tar.gz/v${{ version }}.0
  sha256: ${{ sha256 }}
  target_directory: openssh-portable
  patches:
  - changes.patch
- url: https://github.com/microsoft/vcpkg-tool/releases/download/2026-09-26/vcpkg.exe
  sha256: 2a4ae1467b9e797964c60c919d057b9e5dc1ec03f4b9632c1150026db25201f2
- git: https://github.com/microsoft/vcpkg
  tag: 2026.10.16
- url: https://github.com/ip7z/7zip/releases/download/26.03/7z2603-x64.exe
  sha256: 0859c524b8a63551848f0c246abddcb1d0b7b656b0fbfe879f8d85e61a9e6edd
  target_directory: downloads
  file_name: 7z2603-x64.7z.exe
- url: https://github.com/ip7z/7zip/releases/download/26.03/7zr.exe
  sha256: ad4c82fadcbdf93c03b4fc440f300509c7d60c5c2f4d183e35d9d70d6957037d
  target_directory: downloads/tools/7zr-26.03-windows
- url: https://ftp.openbsd.org/pub/OpenBSD/LibreSSL/libressl-4.3.3.tar.gz
  sha256: ff97c432457f349e6ba3d416ab903bc7468f1436f0f32efe5fff808de292c7b8
  target_directory: downloads
  file_name: libressl-4.3.3.tar.gz
- url: https://codeload.github.com/madler/zlib/tar.gz/v1.3.2
  sha256: b99a0b86c0ba9360ec7e78c4f1e43b1cbdf1e6936c8fa0f6835c0cd694a495a1
  target_directory: downloads
  file_name: madler-zlib-v1.3.2.tar.gz
- url: https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-pkgconf-1~3.0.7-1-any.pkg.tar.zst
  sha256: 37b97f372409fa7cf54d709bab892f34e9c62d2658230a09f783a89a55ae590e
  target_directory: downloads
  file_name: msys2-mingw-w64-x86_64-pkgconf-1~3.0.7-1-any.pkg.tar.zst
- url: https://mirror.msys2.org/msys/x86_64/msys2-runtime-3.6.10-4-x86_64.pkg.tar.zst
  sha256: b13c14c3cbcd34cbcd6aaa0597444779b6102c709120bda2615a2229a482eae2
  target_directory: downloads
  file_name: msys2-msys2-runtime-3.6.10-4-x86_64.pkg.tar.zst
- url: https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip
  sha256: 07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65
  target_directory: downloads
  file_name: ninja-win-1.13.2.zip
- url: https://codeload.github.com/PJK/libcbor/tar.gz/v0.14.0
  sha256: a8c1516e741562cf95aa4479c64916c3d4d2623e24fdc35e414e2320e7300aae
  target_directory: downloads
  file_name: PJK-libcbor-v0.14.0.tar.gz
- url: https://codeload.github.com/Yubico/libfido2/tar.gz/1.17.0
  sha256: ace062d14a482ff9325410ff63d06c8b5fe87e79ebc18dda07add2bc0188c77f
  target_directory: downloads
  file_name: Yubico-libfido2-1.17.0.tar.gz

build:
  number: 0
  script:
  - set "VCPKG_ROOT=%SRC_DIR%"
  - cd openssh-portable\contrib\win32\openssh
  - '"%VCPKG_ROOT%\vcpkg" install --overlay-ports=vcpkg_overlay_ports --overlay-triplets=vcpkg_triplets --triplet x64-custom'
  - copy /y "%LIBRARY_LIB%\zlib.lib" vcpkg_installed\x64-custom\lib\zs.lib
  - >
    sed -i
    -e "s MultiThreaded< MultiThreadedDLL< "
    -e s/v143/v145/
    -e s/\$(VcpkgTriplet)\\\\bin;/\$(VcpkgTriplet)\\\\lib;/
    -e s/\$(VcpkgTriplet)\\\\\$(VcpkgTriplet)/$(VcpkgTriplet)/g
    config.vcxproj
    keygen.vcxproj
    libssh.vcxproj
    openbsd_compat.vcxproj
    scp.vcxproj
    sftp-server.vcxproj
    sftp.vcxproj
    ssh-add.vcxproj
    ssh-agent.vcxproj
    ssh-keyscan.vcxproj
    ssh-pkcs11-helper.vcxproj
    ssh-shellhost.vcxproj
    ssh-sk-helper.vcxproj
    ssh.vcxproj
    sshd-auth.vcxproj
    sshd-session.vcxproj
    sshd.vcxproj
    unittest-bitmap.vcxproj
    unittest-hostkeys.vcxproj
    unittest-kex.vcxproj
    unittest-match.vcxproj
    unittest-misc.vcxproj
    unittest-sshbuf.vcxproj
    unittest-sshkey.vcxproj
    unittest-utf8.vcxproj
    unittest-win32compat.vcxproj
    win32iocompat.vcxproj
  - >
    sed -i /ExcludedFromBuild/d
    unittest-bitmap.vcxproj
    unittest-hostkeys.vcxproj
    unittest-kex.vcxproj
    unittest-match.vcxproj
    unittest-misc.vcxproj
    unittest-sshbuf.vcxproj
    unittest-sshkey.vcxproj
    unittest-utf8.vcxproj
    unittest-win32compat.vcxproj
  - msbuild -p:Configuration=Release;Platform=x64 Win32-OpenSSH.sln
  - mklink /H "%LIBRARY_BIN%\cbor.dll" vcpkg_installed\x64-custom\bin\cbor.dll
  - mklink /H "%LIBRARY_BIN%\fido2.dll" vcpkg_installed\x64-custom\bin\fido2.dll
  - mklink /H "%LIBRARY_BIN%\libcrypto.dll" vcpkg_installed\x64-custom\bin\libcrypto.dll
  - copy "%SRC_DIR%\openssh-portable\bin\x64\Release\*.exe" "%LIBRARY_BIN%"
  - md "%PREFIX%\etc\conda"
  - cd "%PREFIX%\etc\conda"
  - md activate.d deactivate.d
  - copy "%RECIPE_DIR%\*_activate-win.*" activate.d
  - copy "%RECIPE_DIR%\*_deactivate-win.*" deactivate.d
  skip:
  - not win
  - build_platform != target_platform
  - not (compiler('c') is startingwith('vs'))

requirements:
  build:
  - cmake >=3.30.1
  - ${{ compiler('c') }}
  - zlib  # vcpkg searches the build env instead of the host one
  host:
  - git >=2.7.4
  - zlib

tests:
- script:
  - ssh -V

about:
  license_file: openssh-portable/LICENCE
  summary: A suite of secure networking utilities based on the SSH protocol
