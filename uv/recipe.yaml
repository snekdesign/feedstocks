context:
  version: 0.13.0
  sha256: 3d6cbbfd054cbea49336881fffdc2cdd366602a9df974285e84f5cedb25283e8

package:
  name: uv
  version: ${{ version }}

source:
  url: https://github.com/astral-sh/uv/releases/download/${{ version }}/source.tar.gz
  sha256: ${{ sha256 }}
  patches:
  - changes.patch

build:
  number: 0
  script:
    content:
    - if: win
      then:
      - set AWS_LC_SYS_PREBUILT_NASM=0
      - cargo install --features windows-gui-bin --locked --no-track --path crates\uv --root "%LIBRARY_PREFIX%"
      else:
      - cargo install --locked --no-track --path crates/uv --root "$PREFIX"
    env:
      CARGO_HOME: ${{ env.get('CARGO_HOME', default='') }}
      ZSTD_SYS_USE_PKG_CONFIG: '1'
  skip:
  - build_platform != target_platform
  - win and not (compiler('c') is startingwith('vs'))

requirements:
  build:
  - ${{ compiler('c') }}
  - rust >=1.94.0
  - ${{ stdlib('c') }}
  - if: linux
    then: diffutils
  - if: win
    then: nasm
  - pkg-config
  - if: microarch_level|int > 0
    then: x86_64-microarch-level ==${{ microarch_level }}
  host:
  - zstd
  ignore_run_exports:
    by_name:
    - __osx

tests:
- script:
  - uv -V

about:
  license: MIT
  license_file: LICENSE-MIT
  summary: An extremely fast Python package installer and resolver, written in Rust.
