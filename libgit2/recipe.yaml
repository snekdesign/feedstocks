context:
  version: 1.9.7
  sha256: 1a4fbe7589e814777ae76b64734ad80f4ecad22cd33a22682a2aaea4ae5375e7

package:
  name: libgit2
  version: ${{ version }}

source:
  url: https://codeload.github.com/libgit2/libgit2/tar.gz/v${{ version }}
  sha256: ${{ sha256 }}

build:
  number: 0
  script:
  - >-
    cmake
    -B build
    -D BUILD_CLI=OFF
    -D BUILD_TESTS=OFF
    -D REGEX_BACKEND=pcre2
    -D STATIC_CRT=OFF
    -D USE_SSH=exec
    --install-prefix "%LIBRARY_PREFIX%"
  - cmake --build build --config Release --target install
  skip:
  - not win
  - build_platform != target_platform
  - not (compiler('c') is startingwith('vs'))

requirements:
  build:
  - cmake >=3.5.1
  - ${{ compiler('c') }}
  host:
  - pcre2
  - zlib
  run:
  - openssh

about:
  license_file: COPYING
  summary: libgit2 is a portable, pure C implementation of the Git core methods provided as a re-entrant linkable library with a solid API, allowing you to write native speed custom Git applications in any language which supports C bindings.
