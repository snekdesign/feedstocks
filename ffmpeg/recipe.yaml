context:
  version: 9.0.0
  sha256: 7f607a00dd0d28a729d5a4811205812eef01cf6ef6155025febb6f36a9062d52

package:
  name: ffmpeg
  version: ${{ version }}

source:
- url: https://ffmpeg.org/releases/ffmpeg-${{ version|trim('0')|trim('.') }}.tar.xz
  sha256: ${{ sha256 }}
  patches:
  - changes.patch

build:
  number: 0
  script:
    content:
    # TODO: remove once clangxx_win-64 supports vs2026
    - set AR=llvm-ar
    - set "CPPFLAGS_USED=-DNDEBUG -D_CRT_SECURE_NO_WARNINGS -nostdlib -fms-runtime-lib=dll -fuse-ld=lld -fno-aligned-allocation"
    - set "LDFLAGS=-nostdlib -Wl,-defaultlib:%CONDA_PREFIX:\=/%/lib/clang/22/lib/windows/clang_rt.builtins-x86_64.lib"
    - set "CFLAGS=-march=nocona -mtune=haswell -ftree-vectorize -fstack-protector-strong -O2 -ffunction-sections -pipe %CPPFLAGS_USED%"
    - set "CXXFLAGS=-fvisibility-inlines-hidden -std=c++17 -fmessage-length=0 -march=nocona -mtune=haswell -ftree-vectorize -fstack-protector-strong -O2 -ffunction-sections -pipe %CPPFLAGS_USED%"

    - bash -el "%RECIPE_DIR%\build.sh"
    env:
      MSYS2_PATH_TYPE: inherit
  skip:
  - not win
  - build_platform != target_platform
  - not (compiler('c') is startingwith('vs'))

requirements:
  build:
  # same as above
  - clangxx >=22.1.0
  - compiler-rt
  - compiler-rt_win-64
  - lld
  - llvm-tools

  - ${{ compiler('c') }}
  - m2-base
  - m2-diffutils
  - m2-make
  host:
  - ffnvcodec-headers
  - libiconv
  - libplacebo
  - libvulkan-headers
  - libvulkan-loader
  - nasm
  - pkg-config
  - sdl2 >=2.23.1

tests:
- script:
  - ffmpeg -version
  - ffplay -version
  - ffprobe -version

about:
  license: GPL-2.0-or-later
  license_family: GPL
  license_file: COPYING.GPLv2
  summary: Cross-platform solution to record, convert and stream audio and video.
