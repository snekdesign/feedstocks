zip_keys:
- [c_compiler, c_compiler_version]
- [cxx_compiler, cxx_compiler_version]

c_compiler:
- if: osx
  then: clang
  else: gcc
- if: win
  then: vs

c_compiler_version:
- if: osx
  then: '21.1'
  else: '16.1'
- if: win
  then: '2026.1'

c_stdlib:
- if: linux
  then: sysroot
- if: osx
  then: macosx_deployment_target
- if: win
  then: vs

c_stdlib_version:
- if: linux
  then: '2.28'
- if: osx
  then: '10.15'
- if: win
  then: '2026.1'

cxx_compiler:
- if: osx
  then: clangxx
  else: gxx
- if: win
  then: vs

cxx_compiler_version:
- if: osx
  then: '21.1'
  else: '16.1'
- if: win
  then: '2026.1'

cdt_name:
- cos7

fortran_compiler:
- flang

fortran_compiler_version:
- '11.0'

microarch_level:
- if: linux and x86_64
  then: 3
- if: osx and x86_64
  then: 2
- if: win or not x86_64
  then: 0
