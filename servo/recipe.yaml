context:
  version: 0.5.0
  sha256: e73bb22c2ef8d8e7160b506de34028f8b8bd7102ac319f9ea48d8baf6a70cfe3

package:
  name: servo
  version: ${{ version }}

source:
- url: https://codeload.github.com/servo/servo/tar.gz/v${{ version }}
  sha256: ${{ sha256 }}
  patches:
  - changes.patch
- url: https://codeload.github.com/KyleMayes/clang-sys/tar.gz/v1.9.1
  sha256: 8dc83df59331a349e83da38bebcd9019df051eaa1e670119aafcc502505e7e4c
  target_directory: clang-sys
  patches:
  - 0001-conda-build.patch
# https://book.servo.org/building/building-offline.html#prebuilt-spidermonkey-artifacts
- url: https://github.com/servo/mozjs/releases/download/mozjs-sys-v140.13.0-4/libmozjs-x86_64-pc-windows-msvc.tar.gz
  sha256: af50633529af989f1e84ab3fffc3a27e5a5b2163f181261a372bb8e4f7a6dd06
  file_name: libmozjs.tar.gz

build:
  number: 0
  script:
    file: build.py
    env:
      CARGO_HOME: ${{ env.get('CARGO_HOME', default='') }}
  skip:
  - not win
  - build_platform != target_platform
  - not (compiler('cxx') is startingwith('vs'))

requirements:
  build:
  - ${{ compiler('cxx') }}
  - libclang13
  - nasm
  - pkg-config
  - python >=3.14.0
  - rust >=1.86.0
  host:
  - glib
  - gst-libav >=1.18.0
  - gst-plugins-bad >=1.18.0
  - gst-plugins-base >=1.18.0
  - gst-plugins-good >=1.18.0
  - gstreamer >=1.18.0
  - m2-coreutils
  - zlib

tests:
- script:
  - servo -V

about:
  license: MPL-2.0
  license_file: LICENSE
  summary: Servo aims to empower developers with a lightweight, high-performance alternative for embedding web technologies in applications.
