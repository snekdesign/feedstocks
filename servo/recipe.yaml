context:
  version: 0.8.0
  sha256: dc7b427b3408eb3a4a936f8b6150de56dfdace9b518602a188a71b958c215a89

package:
  name: servo
  version: ${{ version }}

source:
- url: https://codeload.github.com/servo/servo/tar.gz/v${{ version }}
  sha256: ${{ sha256 }}
  patches:
  - changes.patch
# https://book.servo.org/building/building-offline.html#prebuilt-spidermonkey-artifacts
- url: https://github.com/servo/mozjs/releases/download/mozjs-sys-v153.6.0-1/libmozjs-x86_64-pc-windows-msvc.tar.gz
  sha256: dc327a1aaccdf58e0a90f647d22ff7ea4d61e141dfc0e46dc94dcc0b7f4cc32f
  file_name: libmozjs.tar.gz

build:
  number: 0
  script:
    file: build.py
    env:
      CARGO_HOME: ${{ env.get('CARGO_HOME', default='') }}
  skip:
  - not win
  - build_platform != target_platform
  - not (compiler('cxx') is startingwith('vs'))

requirements:
  build:
  - clang >=23.1.0
  - ${{ compiler('cxx') }}
  - libclang >=23.1.0
  - nasm
  - pkg-config
  - python >=3.14.0
  - rust >=1.86.0
  host:
  - glib
  - gst-libav >=1.18.0
  - gst-plugins-bad >=1.18.0
  - gst-plugins-base >=1.18.0
  - gst-plugins-good >=1.18.0
  - gstreamer >=1.18.0
  - m2-coreutils
  - zlib

tests:
- script:
  - servo -V

about:
  license: MPL-2.0
  license_file: LICENSE
  summary: Servo aims to empower developers with a lightweight, high-performance alternative for embedding web technologies in applications.
