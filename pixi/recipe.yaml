context:
  version: 0.79.0
  sha256: f9d6e099fa0f66fa1287cedb38ea445d4f32e1a598c23b6e1609a11efbd56009

recipe:
  name: pixi
  version: ${{ version }}

source:
- url: https://codeload.github.com/prefix-dev/pixi/tar.gz/v${{ version }}
  sha256: ${{ sha256 }}
  target_directory: pixi
  patches:
  - changes.patch
- url: https://codeload.github.com/conda/rattler/tar.gz/rattler-v0.48.6
  sha256: 559c90be1c24b9a8882a59197d71a169a18055042539bc821521115aa61f3d3f
  target_directory: rattler
  patches:
  - 0001-strip-dquotes.patch

build:
  number: 0
  skip:
  - build_platform != target_platform
  - win and not (compiler('c') is startingwith('vs'))

outputs:
- staging:
    name: pixi-build
  requirements:
    build:
    - ${{ compiler('c') }}
    - rust >=1.94.0
    - ${{ stdlib('c') }}
    - if: linux
      then: diffutils
    - if: linux
      then: make
    - nasm
    - if: microarch_level|int > 0
      then: x86_64-microarch-level ==${{ microarch_level }}
  build:
    script:
      content:
      - cd pixi
      - cargo fetch
      - if: win
        then:
        - set AWS_LC_SYS_PREBUILT_NASM=0
        - cargo install --features performance --frozen --no-track --path crates/pixi --root "%LIBRARY_PREFIX%"
        - cargo install --frozen --no-track --path crates/pixi_build_python --root "%LIBRARY_PREFIX%"
        - cargo install --frozen --no-track --path crates/pixi_build_rattler_build --root "%LIBRARY_PREFIX%"
        else:
        - cargo install --features performance --frozen --no-track --path crates/pixi --root "$PREFIX"
        - cargo install --frozen --no-track --path crates/pixi_build_python --root "$PREFIX"
        - cargo install --frozen --no-track --path crates/pixi_build_rattler_build --root "$PREFIX"
      env:
        CARGO_HOME: ${{ env.get('CARGO_HOME', default='') }}
- package:
    name: pixi
  inherit: pixi-build
  requirements:
    ignore_run_exports:
      by_name:
      - __osx
  build:
    files:
    - bin/pixi
    - Library/bin/pixi.exe
  tests:
  - script:
    - pixi -V
- package:
    name: pixi-build-python
  inherit: pixi-build
  requirements:
    ignore_run_exports:
      by_name:
      - __osx
  build:
    files:
    - bin/pixi-build-python
    - Library/bin/pixi-build-python.exe
  tests:
  - script:
    - pixi-build-python help
- package:
    name: pixi-build-rattler-build
  inherit: pixi-build
  requirements:
    ignore_run_exports:
      by_name:
      - __osx
  build:
    files:
    - bin/pixi-build-rattler-build
    - Library/bin/pixi-build-rattler-build.exe
  tests:
  - script:
    - pixi-build-rattler-build help

about:
  license: BSD-3-Clause
  license_family: BSD
  license_file: pixi/LICENSE
  summary: pixi is a cross-platform, multi-language package manager and workflow tool build on the shoulders of the conda ecosystem.
