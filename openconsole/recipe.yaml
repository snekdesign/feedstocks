context:
  version: 1.25.3131
  sha256: 45c9150f3317ef8f9840b70c7357fd6578762617178edf59521645b58842d228

package:
  name: openconsole
  version: ${{ version }}

source:
  url: https://codeload.github.com/microsoft/terminal/tar.gz/v${{ version }}.0
  sha256: ${{ sha256 }}
  patches:
  - 0001-conda-build.patch

build:
  number: 0
  script:
    content:
    - set "SolutionDir=%SRC_DIR%\"
    - msbuild src\host\exe\Host.EXE.vcxproj -p:Configuration=Release;Platform=x64
    - msbuild src\winconpty\dll\winconptydll.vcxproj -p:Configuration=Release;Platform=x64
    - mklink /H "%LIBRARY_BIN%\OpenConsole.exe" bin\x64\Release\OpenConsole.exe
    - mklink /H "%LIBRARY_BIN%\conpty.dll" bin\x64\Release\conpty.dll
    env:
      USERPROFILE: ${{ env.get('USERPROFILE') }}
  skip:
  - not win
  - build_platform != target_platform
  - not (compiler('cxx') is startingwith('vs'))

requirements:
  build:
  - ${{ compiler('cxx') }}
  host:
  - fmt
  - ms-gsl 4.2.*
  - icu 79.*
  - mingw-w64-ucrt-x86_64-crt-git
  - wil

about:
  license_file: LICENSE
