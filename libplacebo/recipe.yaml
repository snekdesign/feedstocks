context:
  version: 7.387.0
  sha256: f9e62d3774a9c4cfd198ec3abaa88294aaade2e31c04d5ab02bcf4abc98b1df5

package:
  name: libplacebo
  version: ${{ version }}

source:
  url: https://codeload.github.com/haasn/libplacebo/tar.gz/refs/tags/v${{ version }}
  sha256: ${{ sha256 }}
  patches:
  - changes.patch

build:
  number: 0
  script:
  # TODO: remove once clangxx_win-64 supports vs2026
  - set CC=clang
  - set NM=llvm-nm
  - set LD=lld-link
  - set AR=llvm-ar
  - set RANLIB=llvm-ranlib
  - set "CPPFLAGS_USED=-DNDEBUG -D_CRT_SECURE_NO_WARNINGS -nostdlib -fms-runtime-lib=dll -fuse-ld=lld -fno-aligned-allocation"
  - set "LDFLAGS=-nostdlib -Wl,-defaultlib:%CONDA_PREFIX:\=/%/lib/clang/23/lib/windows/clang_rt.builtins-x86_64.lib"
  - set "CFLAGS=-march=nocona -mtune=haswell -ftree-vectorize -fstack-protector-strong -O2 -ffunction-sections -pipe %CPPFLAGS_USED%"
  - set CXX=clang++
  - set "CXXFLAGS=-fvisibility-inlines-hidden -std=c++17 -fmessage-length=0 -march=nocona -mtune=haswell -ftree-vectorize -fstack-protector-strong -O2 -ffunction-sections -pipe %CPPFLAGS_USED%"

  - meson setup --buildtype release --prefix "%LIBRARY_PREFIX%" -D demos=false build
  - cd build
  - meson compile
  - meson install
  skip:
  - not win
  - build_platform != target_platform
  - not (compiler('cxx') is startingwith('vs'))

requirements:
  build:
  # same as above
  - clangxx >=23.1.0
  - compiler-rt
  - compiler-rt_win-64
  - lld
  - llvm-tools

  - ${{ compiler('cxx') }}
  - glad2
  - jinja2
  - meson
  - pkg-config
  host:
  - fast_float
  - libvulkan-headers
  - libvulkan-loader
  - shaderc
  - xxhash
  run_exports:
  - ${{ pin_subpackage('libplacebo', upper_bound='x.x.x') }}
  ignore_run_exports:
    from_package:
    - xxhash

about:
  license: LGPL-2.1-or-later
  license_file: LICENSE
  summary: Core rendering algorithms and ideas from mpv as an independent library
