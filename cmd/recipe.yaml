context:
  version: 0.4.16
  sha256: 978d2f7770cda793df05929f01e5ea2ff4939140982fa1a5bdb4e12c941e91d9

package:
  name: cmd
  version: ${{ version }}

source:
  url: https://codeload.github.com/reactos/reactos/tar.gz/0.4.16-release
  sha256: ${{ sha256 }}

build:
  number: 0
  script:
  - call configure.cmd %CMAKE_ARGS%
  - cd output-VS-amd64
  - ninja base\shell\cmd\cmd.exe
  - mklink /H "%LIBRARY_BIN%\cmd.exe" base\shell\cmd\cmd.exe
  skip:
  - not win
  - build_platform != target_platform
  - not (compiler('cxx') is startingwith('vs'))

requirements:
  build:
  - cmake >=3.17.0,<4
  - ${{ compiler('cxx') }}
  - ninja
  - winflexbison

about:
  license_file:
  - COPYING
  - base/shell/cmd/license.txt
