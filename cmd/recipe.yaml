context:
  version: 0.4.16rc2
  sha256: a467a615383da7dbe82003be2969e6e64a90914c99c5e30ee3ca4268b79c28d7

package:
  name: cmd
  version: ${{ version }}

source:
  url: https://codeload.github.com/reactos/reactos/tar.gz/0.4.16-RC2
  sha256: ${{ sha256 }}

build:
  number: 0
  script:
  - call configure.cmd %CMAKE_ARGS%
  - cd output-VS-amd64
  - ninja base\shell\cmd\cmd.exe
  - mklink /H "%LIBRARY_BIN%\cmd.exe" base\shell\cmd\cmd.exe
  skip:
  - not win
  - build_platform != target_platform
  - not (compiler('cxx') is startingwith('vs'))

requirements:
  build:
  - cmake >=3.17.0,<4
  - ${{ compiler('cxx') }}
  - ninja
  - winflexbison

about:
  license_file:
  - COPYING
  - base/shell/cmd/license.txt
