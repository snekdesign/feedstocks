context:
  version: 1.9.7
  sha256: 853d1769246e7e036fca09f8af708f069cdf19d346b231d40f2e2e754ab3666d

package:
  name: tombi
  version: ${{ version }}

source:
  url: https://codeload.github.com/pavelzw/tombi/tar.gz/v${{ version }}-pixi
  sha256: ${{ sha256 }}
  patches:
  - changes.patch

build:
  number: 0
  script:
    content:
    - cargo install --locked --no-track --path rust/tombi-cli --root "%LIBRARY_PREFIX%"
    env:
      AWS_LC_SYS_PREBUILT_NASM: '0'
      CARGO_HOME: ${{ env.get('CARGO_HOME', default='') }}
      PIXI_HOME: ${{ env.get('PIXI_HOME', default='') }}
  skip:
  - not win
  - build_platform != target_platform
  - not (compiler('c') is startingwith('vs'))

requirements:
  build:
  - ${{ compiler('c') }}
  - nasm
  - rust >=1.94.0
  - if: microarch_level|int > 0
    then: x86_64-microarch-level ==${{ microarch_level }}

tests:
- script:
  - tombi -V

about:
  license: MIT
  license_file: LICENSE
  summary: TOML Formatter / Linter / Language Server
